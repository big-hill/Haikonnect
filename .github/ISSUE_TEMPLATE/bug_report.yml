name: Bug report
description: Report a reproducible problem in the BeRD Haiku port
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include agent keys, installation codes, tokens, session IDs or private host details.
  - type: input
    id: revision
    attributes:
      label: Haiku revision
      placeholder: hrev…
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and architecture
      placeholder: Python 3.10.x, x86_64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include concise, redacted logs and exact steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, tokens, session IDs, private IPs and personal paths.
          required: true
